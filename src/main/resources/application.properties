spring.application.name=kinetic-energy-system
server.port=8080

# ========================================================
# MySQL Database Connection (Database: kinetic_energy_db)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kinetic_energy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Hibernate / JPA Settings
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
